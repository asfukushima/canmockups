tex.encoding=THREE.sRGBEncoding;tex.anisotropy=R.capabilities.getMaxAnisotropy();
const H=2.98;
const body=new THREE.Mesh(new THREE.CylinderGeometry(1,1,H,128,1,true),
 new THREE.MeshPhongMaterial({map:tex,specular:0x666666,shininess:70}));
can.add(body);
const silver=new THREE.MeshPhongMaterial({color:0xd5d9dc,specular:0xffffff,shininess:110});
const mint=new THREE.MeshPhongMaterial({color:0x95c9ab,specular:0xaaaaaa,shininess:80});
const V=a=>a.map(p=>new THREE.Vector2(p[0],p[1]));
const lathe=(pts,m,side)=>{m.side=THREE.DoubleSide;const l=new THREE.Mesh(new THREE.LatheGeometry(V(pts),96),m);can.add(l)};
const y0=H/2;
lathe([[0,-y0-.06],[.6,-y0-.06],[.68,-y0-.13],[.8,-y0-.13],[.9,-y0-.06],[.97,-y0],[1,-y0]],silver);
lathe([[1,y0],[.97,y0+.06],[.9,y0+.2],[.82,y0+.29],[.8,y0+.33]],mint);
lathe([[.8,y0+.33],[.82,y0+.38],[.78,y0+.41],[.74,y0+.37],[.72,y0+.29],[.66,y0+.25],[0,y0+.25]],silver);
const tab=new THREE.Shape();tab.absellipse(0,0,.3,.17,0,Math.PI*2);
const tm=new THREE.Mesh(new THREE.ExtrudeGeometry(tab,{depth:.02,bevelEnabled:false}),silver);
tm.rotation.x=-Math.PI/2;tm.position.set(0,y0+.27,.05);can.add(tm);
const sh=new THREE.Mesh(new THREE.CircleGeometry(1.5,48),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.18}));
sh.rotation.x=-Math.PI/2;sh.position.y=-y0-.15;sh.scale.set(1,1,.45);S.add(sh);
let yaw=-.19*Math.PI*2,tilt=.12,spin=true,target=null;
function size(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();
 dist=Math.max(7,Math.min(14,(w<h?9.5:8)*(w<h?Math.max(1,(h/w)*.55):1)))}
addEventListener('resize',size);size();
let dragging=false,lx=0,ly=0;
cv.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;spin=false;target=null;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!dragging)return;yaw+=(e.clientX-lx)*.01;tilt=Math.max(-.6,Math.min(.9,tilt+(e.clientY-ly)*.005));lx=e.clientX;ly=e.clientY});
cv.addEventListener('pointerup',()=>dragging=false);
cv.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(5,Math.min(16,dist+e.deltaY*.005))},{passive:false});
let pd=0;cv.addEventListener('touchmove',e=>{if(e.touches.length==2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pd)dist=Math.max(5,Math.min(16,dist-(d-pd)*.03));pd=d}},{passive:true});
cv.addEventListener('touchend',()=>pd=0);
document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{spin=false;document.getElementById('spin').textContent='Resume spin';
 let t=-parseFloat(b.dataset.u)*Math.PI*2;const n=Math.round((yaw-t)/(Math.PI*2));target=t+n*Math.PI*2});
document.getElementById('spin').onclick=e=>{spin=!spin;target=null;e.target.textContent=spin?'Pause spin':'Resume spin'};
(function loop(){requestAnimationFrame(loop);
 if(spin)yaw+=.006;else if(target!==null){yaw+=(target-yaw)*.1;if(Math.abs(target-yaw)<.001)target=null}
 can.rotation.y=yaw;can.rotation.x=tilt;
 cam.position.set(0,.4,dist);cam.lookAt(0,.1,0);R.render(S,cam)})();
