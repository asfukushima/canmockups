tex.encoding=THREE.sRGBEncoding;tex.anisotropy=R.capabilities.getMaxAnisotropy();

const silver=new THREE.MeshPhongMaterial({color:0xd5d9dc,specular:0xffffff,shininess:110});

tm.rotation.x=-Math.PI/2;tm.position.set(0,y0+.27,.05);can.add(tm);

let yaw=-.19*Math.PI*2,tilt=.12,spin=true,target=null;
function size(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();

let dragging=false,lx=0,ly=0;
